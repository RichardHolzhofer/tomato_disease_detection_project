[project]
name = "disease-detection-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dagshub>=0.6.8",
    "dvc>=3.66.1",
    "dvc-s3>=3.3.0",
    "evaluate>=0.4.6",
    "kagglehub>=1.0.0",
    "langchain>=1.2.10",
    "langchain-groq>=1.1.2",
    "matplotlib>=3.10.8",
    "mlflow>=3.10.1",
    "numpy>=2.4.2",
    "optuna>=4.7.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "streamlit>=1.55.0",
    "torch>=2.1.0",
    "torchmetrics>=1.8.2",
    "torchsummary>=1.5.1",
    "torchvision>=0.16.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true